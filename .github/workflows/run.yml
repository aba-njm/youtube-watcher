Name: YouTube Auto Downloader

on:
  schedule:
    - cron: '*/15 * * * *' # تشغيل تلقائي كل 15 دقيقة
  workflow_dispatch: # يتيح لك تشغيله يدوياً

permissions:
  contents: write

concurrency:
  group: "bot-runner"
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: جلب ملفات الكود
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: تثبيت بايثون
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: تثبيت المكتبات
      run: pip install -r requirements.txt

    - name: تشغيل السكربت المراقب
      env:
        API_ID: ${{ secrets.API_ID }}
        API_HASH: ${{ secrets.API_HASH }}
        TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        TARGET_BOT: ${{ secrets.TARGET_BOT }}
        SECOND_ACCOUNT: ${{ secrets.SECOND_ACCOUNT }}
      run: python watcher.py

    - name: Save and Commit History
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"

        # 1. جلب التحديثات الأخيرة من المستودع
        git fetch origin main || true

        # 2. دمج المحتوى مع النسخة الموجودة في GitHub وإزالة التكرار
        touch history.txt
        git show origin/main:history.txt >> history.txt 2>/dev/null || true
        sort -u history.txt -o history.txt

        # 3. حفظ التغييرات والرفع مع التعامل مع تعارضات الدمج تلقائياً
        git add history.txt
        git commit -m "🤖 تحديث سجل الفيديوهات المحملة تلقائياً [skip ci]" || echo "لا توجد تغييرات للحفظ"
        git push origin HEAD:main || (git pull origin main --rebase -X ours && git push origin HEAD:main)
